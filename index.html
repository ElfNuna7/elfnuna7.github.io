<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ElfNuna — Литературный архив и библиотека</title>
  <meta name="description" content="Официальная библиотека автора ElfNuna: романы, повести, тёмное фэнтези, мистика и военная драма.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header -->
  <header class="site-header">
    <div class="header-container">
      <a href="index.html" class="brand-link">
        <span class="brand-logo">EN</span>
        <span class="brand-title">ElfNuna</span>
      </a>
      <nav class="header-nav">
        <a href="index.html" class="header-nav-link active">Книги</a>
        <a href="https://github.com/ElfNuna7" target="_blank" rel="noopener noreferrer" class="header-nav-link">GitHub</a>
        <a href="https://t.me/ElfNuna_ai_bot" target="_blank" rel="noopener noreferrer" class="header-nav-link">Telegram</a>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-wrapper">
    <!-- Toolbar (Match Screenshot 2) -->
    <div class="catalog-toolbar">
      <h1 class="catalog-title">Произведения автора</h1>
      
      <div class="toolbar-actions">
        <!-- Status Filter -->
        <div class="filter-pills" id="filterPills">
          <button type="button" class="filter-pill active" data-filter="all">Все</button>
          <button type="button" class="filter-pill" data-filter="ongoing">Онгоинги</button>
          <button type="button" class="filter-pill" data-filter="completed">Завершенные</button>
        </div>

        <!-- View Toggle (List vs Grid) -->
        <div class="view-toggle">
          <button type="button" class="view-btn active" id="viewListBtn" title="Список">&#9776;</button>
          <button type="button" class="view-btn" id="viewGridBtn" title="Сетка">&#9638;</button>
        </div>
      </div>
    </div>

    <!-- Books Container -->
    <div class="books-list" id="booksContainer">
      <!-- Injected via JavaScript from BOOKS_DATA -->
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="footer-container">
      <p class="footer-text">&copy; 2026 ElfNuna. Все права на тексты и вселенную принадлежат автору.</p>
      <div class="header-nav">
        <a href="index.html" class="footer-text">Каталог</a>
        <a href="https://t.me/ElfNuna_ai_bot" target="_blank" rel="noopener noreferrer" class="footer-text">Бот автора</a>
      </div>
    </div>
  </footer>

  <script src="data/books.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('booksContainer');
      const filterPills = document.querySelectorAll('.filter-pill');
      const viewListBtn = document.getElementById('viewListBtn');
      const viewGridBtn = document.getElementById('viewGridBtn');

      let currentFilter = 'all';
      let currentView = 'list';

      function renderBooks() {
        const filtered = BOOKS_DATA.filter(b => {
          if (currentFilter === 'ongoing') return b.isOngoing;
          if (currentFilter === 'completed') return !b.isOngoing;
          return true;
        });

        container.className = currentView === 'list' ? 'books-list' : 'books-grid';
        container.innerHTML = '';

        filtered.forEach(book => {
          const card = document.createElement('article');
          card.className = 'book-item-card';

          const statusClass = book.isOngoing ? 'ongoing' : '';
          const metaLine = `${book.type} <span>${book.releaseYear}</span> <span>${book.genres.slice(0, 3).join(', ')}</span>`;

          // Check reading progress from localStorage
          const savedProgress = localStorage.getItem('last_read_' + book.id);
          const progressText = savedProgress ? `Продолжить: Гл. ${savedProgress}` : 'Читать онлайн';

          card.innerHTML = `
            <div class="book-cover-wrap">
              <img src="${book.cover}" alt="${book.title}" class="book-cover-img" loading="lazy">
              <span class="book-badge-rating">${book.rating}</span>
              <span class="book-badge-status ${statusClass}">${book.statusTag}</span>
            </div>
            <div class="book-details">
              <h2 class="book-title-link">
                <a href="book.html?id=${book.id}">${book.title}</a>
              </h2>
              <div class="book-meta-line">${metaLine}</div>
              <p class="book-synopsis">${book.synopsis}</p>
              <div class="book-card-footer">
                <span class="book-chapters-count">${book.totalChapters} глав &bull; ${book.ageRating}</span>
                <a href="book.html?id=${book.id}" class="book-open-btn">${progressText} &rarr;</a>
              </div>
            </div>
          `;
          container.appendChild(card);
        });
      }

      // Filter events
      filterPills.forEach(btn => {
        btn.addEventListener('click', () => {
          filterPills.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentFilter = btn.dataset.filter;
          renderBooks();
        });
      });

      // View toggle events
      viewListBtn.addEventListener('click', () => {
        viewListBtn.classList.add('active');
        viewGridBtn.classList.remove('active');
        currentView = 'list';
        renderBooks();
      });

      viewGridBtn.addEventListener('click', () => {
        viewGridBtn.classList.add('active');
        viewListBtn.classList.remove('active');
        currentView = 'grid';
        renderBooks();
      });

      renderBooks();
    });
  </script>
</body>
</html>
